<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#172c59">
    <title>요룡이의 과학 모험 · 부광고등학교</title>
    <link rel="icon" href="assets/hero.png">
    <link rel="stylesheet" href="style.css?v=boss-top">
  </head>
  <body>
    <main id="shell">
      <h1 class="sr-only">요룡이의 과학 모험</h1>
      <section id="stage" aria-label="모험 필드">
        <canvas id="map-depth" hidden aria-hidden="true"></canvas>
        <canvas id="world" tabindex="0" aria-label="요룡이 모험 필드"></canvas>
        <canvas id="field-lettering" aria-hidden="true"></canvas>
        <div id="scene-shade" aria-hidden="true"></div>
        <div id="scene-arrival" role="status" aria-live="polite" aria-atomic="true">
          <div class="arrival-sign"><strong id="arrival-place"></strong><span id="arrival-detail"></span></div>
        </div>
        <div id="quest-notice" role="status" aria-live="polite" aria-atomic="true" hidden>
          <div class="quest-fanfare">
            <div class="fanfare-heading"><strong id="qn-status"></strong></div>
            <span id="qn-finished"></span>
          </div>
          <div class="quest-next">
            <div class="quest-next-heading">
              <img id="qn-portrait" src="assets/hero.png" alt="">
              <div><small id="qn-caption"></small><strong id="qn-title"></strong></div>
            </div>
            <p id="qn-detail"></p>
            <p class="notice-destination"><span>목적지</span> <b id="qn-place"></b></p>
          </div>
        </div>
        <div class="hud-top">
          <div class="map-window">
            <div class="map-head">
              <button id="minimap" data-tip="캠퍼스 지도 (M)">
                <i data-icon="zelkova"></i><b id="maptitle"></b>
              </button>
              <button id="mapfold" aria-controls="mapview" aria-label="미니맵 접기" aria-expanded="true"></button>
            </div>
            <canvas width="176" height="48" id="mapview" aria-hidden="true"></canvas>
          </div>
          <div class="boss-track" id="boss-meter" role="progressbar" aria-label="보스 체력" aria-valuemin="0" aria-valuemax="100" hidden>
            <span id="bossfill"></span>
          </div>
          <p id="boss-warning" aria-live="polite"></p>
          <nav class="field-tools" aria-label="모험 정보">
            <button id="quest" aria-haspopup="dialog" aria-keyshortcuts="J" aria-describedby="qaction"><span class="quest-heading"><i data-icon="quest"></i><small id="qchapter"></small><kbd>J</kbd></span>
              <strong id="qtitle"></strong><span id="qaction"></span></button>
            <button id="menu" aria-label="모험 메뉴" data-tip="모험 메뉴 (Esc)"><i data-icon="globe"></i><span>메뉴</span></button>
          </nav>
        </div>
        <div id="toast" role="status"></div>
      </section>
      <section class="dock" aria-label="캐릭터 상태와 조작">
        <div class="player" role="group" aria-label="요룡이 상태">
          <img class="field-badge" src="assets/ui/globe.png" width="40" height="40" alt="">
          <div class="stats">
            <div class="name"><small id="level"></small><b>요룡이</b><span class="school-name">부광고등학교</span></div>
            <div class="statline"><b>HP</b><span class="track hp"><i id="hpbar"></i></span><small id="hpval"></small></div>
            <div class="statline"><b>MP</b><span class="track mp"><i id="mpbar"></i></span><small id="mpval"></small></div>
          </div>
        </div>
        <button id="controls" class="controls">조작 안내 <kbd>←</kbd><kbd>→</kbd> 이동 <kbd>↑</kbd> 상호작용</button>
        <div class="quickbar" role="group" aria-label="전투 퀵슬롯">
          <button class="edit" id="loadout" aria-label="스킬 배치 (K)" data-tip="스킬 배치 (K)"><i data-icon="slots"></i></button>
          <div id="slots"></div>
        </div>
        <div id="touch" aria-label="터치 조작">
          <div><button data-key="ArrowLeft" aria-label="왼쪽 이동"><i data-icon="left"></i></button><button data-key="ArrowDown" aria-label="아래 방향 · 계단 내려가기"><i data-icon="interact"></i></button><button data-key="ArrowRight" aria-label="오른쪽 이동"><i data-icon="right"></i></button></div>
          <div><button data-key="AltLeft">점프</button><button data-key="ShiftLeft">회피</button><button data-key="ArrowUp" aria-label="대화 · 입장 · 계단 올라가기"><i data-icon="interact"></i></button></div>
        </div>
      </section>
      <div id="overlay" hidden>
        <section id="panel" role="dialog" aria-modal="true" aria-labelledby="paneltitle"></section>
      </div>
    </main>
    <audio id="campus-music" preload="none" loop></audio>
    <audio id="battle-music" preload="none" loop></audio>
    <script src="data.js?v=giants"></script>
    <script src="assets/world/classrooms.js"></script>
    <script src="icons.js"></script>
    <script src="actor-sheets.js"></script>
    <script src="assets/combat/pixelfx.js"></script>
    <script src="assets/audio/sfx/bank.js?v=recorded"></script>
    <script src="sound-effects.js?v=recorded"></script>
    <script src="quests.js?v=recorded"></script>
    <script src="bosses.js?v=recorded"></script>
    <script src="game.js?v=recorded"></script>
    <script src="assets/world/atlas.js"></script>
    <script src="assets/world/fixtures.js"></script>
    <script src="scenery.js?v=campus2"></script>
    <script src="vendor/three-r187.min.js"></script>
    <script src="map3d.js?v=giants"></script>
    <script src="combat-fx.js?v=giants"></script>
    <script src="render.js?v=stairs-step"></script>
  </body>
</html>

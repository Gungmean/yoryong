<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#202431" />
    <title>요룡이의 과학 모험 · 부광고등학교</title>
    <link rel="icon" href="assets/hero.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="shell">
      <header class="mast">
        <div class="brand">
          <i data-icon="crystal"></i>
          <h1>요룡이의 <em>과학 모험</em></h1>
          <span class="brand-en">BUGWANG QUEST</span>
        </div>
        <nav>
          <button id="sound" title="효과음 켜기" aria-label="효과음 켜기">
            <i data-icon="sound"></i><span>사운드</span></button
          ><button id="full">
            <i data-icon="expand"></i><span>전체화면</span></button
          ><button id="menu"><i data-icon="menu"></i><span>메뉴</span></button>
        </nav>
      </header>
      <section id="stage" aria-label="횡스크롤 게임 화면">
        <canvas id="world" tabindex="0" aria-label="요룡이 모험 필드"></canvas>
        <div class="player box">
          <div class="face"><img src="assets/hero.png" alt="요룡이" /></div>
          <div class="stats">
            <div class="name">요룡이 <small id="level">Lv. 01</small></div>
            <div class="statline">
              <b>HP</b
              ><span class="track hp"
                ><i id="hpbar"></i><small id="hpval"></small
              ></span>
            </div>
            <div class="statline">
              <b>MP</b
              ><span class="track mp"
                ><i id="mpbar"></i><small id="mpval"></small
              ></span>
            </div>
          </div>
        </div>
        <button id="quest" class="quest box">
          <span class="micro"><i data-icon="quest"></i> 현재 퀘스트</span
          ><strong id="qtitle"></strong><span id="qdesc"></span>
        </button>
        <button id="minimap" class="map box" title="캠퍼스 지도 열기 (M)">
          <span class="map-top"
            ><i data-icon="pin"></i><b id="maptitle">부광고등학교 정문</b
            ><kbd>M</kbd></span
          ><canvas width="168" height="47" id="mapview"></canvas>
        </button>
        <div id="zone" class="zone">
          <span class="bead"></span><span id="zonetext"></span>
        </div>
        <div id="bossbar" hidden></div>
        <div id="toast" role="status"></div>
      </section>
      <section class="console">
        <div class="seals">
          <div class="sectionhead">
            <span class="diamond"></span>
            <h2>과학의 인장</h2>
            <small id="sealcount"></small>
          </div>
          <div id="seallist"></div>
        </div>
        <div class="actions">
          <div class="sectionhead">
            <span class="diamond"></span>
            <h2>액션 슬롯</h2>
            <button class="edit" id="loadout">스킬 배치 <kbd>K</kbd></button>
          </div>
          <div id="slots"></div>
        </div>
      </section>
      <footer>
        <div class="keys">
          <span><kbd>←</kbd><kbd>→</kbd> 이동</span
          ><span><kbd>Alt</kbd> 더블 점프</span
          ><span><kbd>Shift</kbd> 회피</span><span><kbd>A</kbd> 공격</span
          ><span><kbd>Q W E R</kbd> 스킬</span
          ><span><kbd>↑</kbd> 상호작용</span>
        </div>
        <span class="save"><b></b><span id="savestatus">자동 저장</span></span>
      </footer>
      <div id="touch">
        <button data-key="ArrowLeft">◀</button
        ><button data-key="ArrowRight">▶</button
        ><button data-key="AltLeft">점프</button
        ><button data-key="ShiftLeft">회피</button
        ><button data-key="ArrowUp">대화 / 입장</button>
      </div>
      <div id="overlay" hidden>
        <section
          id="panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="paneltitle"
        ></section>
      </div>
    </main>
    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script src="actor-sheets.js"></script>
    <script src="game.js"></script>
    <script src="render.js"></script>
  </body>
</html>
